'โครงการดูแลผู้สูงอายุยากไร้ที่ขาดโอกาส ร่วมกับผู้นำชุมชนและ อสม. ด้วยการเยี่ยมบ้าน ประเมินสุขภาพ มอบอาหาร ยาสามัญประจำบ้าน และปรับปรุงที่อยู่อาศัย (ขยายพื้นที่สู่ อ.แม่สอด จ.ตาก)':['A programme caring for disadvantaged older people with community leaders and village health volunteers: home visits, health checks, food, basic medicines and housing repairs (expanding to Mae Sot, Tak).','ရပ်ရွာခေါင်းဆောင်များနှင့် ကျေးရွာကျန်းမာရေးစေတနာ့ဝန်ထမ်းများနှင့်အတူ ဆင်းရဲနွမ်းပါးသော သက်ကြီးရွယ်အိုများကို စောင့်ရှောက်သည့်စီမံကိန်း - အိမ်လည်ပတ်ခြင်း၊ ကျန်းမာရေးစစ်ဆေးခြင်း၊ အစားအစာ၊ အခြေခံဆေးနှင့် အိမ်ပြုပြင်ခြင်း (မဲဆောက်၊ တာက်သို့ ချဲ့ထွင်)။'],

function trs(s){if(LANG=='th')return s;const i=LANG=='en'?0:1,k=s.trim(),w=x=>DICT[x]?DICT[x][i]:x;if(DICT[k])return s.replace(k,DICT[k][i]);
 return s.replace(/^สวัสดี /,w('สวัสดี')+' ').replace(/^ฐานข้อมูลผู้สูงอายุ /,w('ฐานข้อมูลผู้สูงอายุ')+' ')
 .replace(/ด้าน (\d): (.*?)( \(ในการเยี่ยม\))?$/,(x,a,b,c)=>`${i?'ဒိုမိန်း':'Domain'} ${a}: ${w(b)}${c?(i?' (လည်ပတ်စဉ်)':' (in visit)'):''}`)
 .replace(/(^|\s)เยี่ยมบ้าน \(/,(x,p)=>p+w('เยี่ยมบ้าน')+' (').replace(/(\d+|\?) ปี/g,(x,a)=>a+(i?' နှစ်':' yrs'))}
function trNode(n){if(n.nodeType==3){if(n._o===undefined)n._o=n.data;const v=trs(n._o);if(n.data!==v)n.data=v}
 else if(n.nodeType==1&&n.tagName!='SCRIPT'&&n.tagName!='STYLE'){['placeholder','title'].forEach(a=>{if(n.hasAttribute(a)){if(n['_'+a]===undefined)n['_'+a]=n.getAttribute(a);n.setAttribute(a,trs(n['_'+a]))}});n.childNodes.forEach(trNode)}}

const SHORT={1:'เคลื่อนไหว',2:'โภชนาการ',3:'สภาพบ้าน',4:'คนรอบข้าง',5:'การใช้ยา',6:'ตรวจร่างกาย',7:'ความปลอดภัย',8:'จิตวิญญาณ',9:'บริการ'};
const cl=x=>Math.max(0,Math.min(100,Math.round(x))),nz=x=>x!==''&&x!=null&&!isNaN(+x),col=x=>x==null?'#bbb':x>=70?'#2e9e6b':x>=40?'#f28f3b':'#d64545';
const SC={
1:v=>{const o=[];let s=0,n=0;for(let i=1;i<=16;i++)if(v['a'+i]){s+=+v['a'+i];n++}
 if(n==16)o.push(['BADL/IADL',cl((48-s)/32*100),s+'/48']);if(nz(v.tug))o.push(['TUG',cl((30-v.tug)/22*100),v.tug+' s']);
 if(Array.isArray(v.frat)){const t=v.frat.reduce((a,x)=>a+ +x.match(/\((\d)\)$/)[1],0);o.push(['Thai-FRAT',cl((11-t)/11*100),t+'/11'])}return o},
2:v=>{const o=[];if(nz(v.wt)&&nz(v.ht)){const b=v.wt/Math.pow(v.ht/100,2);o.push(['BMI',cl(100-Math.max(18.5-b,b-22.9,0)*12),b.toFixed(1)])}
 if(nz(v.meals))o.push(['Meals/day',cl(v.meals/3*100),v.meals]);if(v.alc||v.smk)o.push(['Alcohol/smoking',100-(v.alc=='มี'?50:0)-(v.smk=='มี'?50:0),(v.alc=='มี'?'A ':'')+(v.smk=='มี'?'S':'-')]);return o},
3:v=>{const o=[];if(Array.isArray(v.hs))o.push(['Home checklist',cl(v.hs.length/4*100),v.hs.length+'/4']);const n=[1,2,3,4,5,6,7].filter(i=>v['p'+i]).length;if(n)o.push(['Photo record',cl(n/7*100),n+'/7']);return o},
4:v=>{const o=[];if(v.cg){o.push(['Caregiver',v.cg=='มี'?100:v.dep=='มี'?0:70,v.cg]);o.push(['Community',v.com?100:30,v.com?'✓':'-'])}if(v.nbc)o.push(['Neighbours',v.nbc=='สนิท'?100:40,v.nbc]);return o},
5:v=>{const o=[];if(v.adh)o.push(['Adherence',v.adh=='ใช่'?100:20,v.adh]);if(v.who)o.push(['Med. management',v.who=='มีคนจัดให้'?100:70,v.who=='มีคนจัดให้'?'assisted':'self']);
 const m=((v.rx||'')+';'+(v.otc||'')).split(/[;\n]/).filter(x=>x.trim()).length;if(m)o.push(['Polypharmacy',m<=3?100:m<=5?70:40,m+' items']);return o},
6:v=>{const o=[];if(nz(v.sys)&&nz(v.dia)){const a=+v.sys,b=+v.dia;o.push(['BP',a<130&&b<85?100:a<140&&b<90?80:a<160&&b<100?50:20,a+'/'+b])}
 if(nz(v.dtx)){const d=+v.dtx;o.push(['DTX',d>=70&&d<=140?100:d<=180&&d>=70?65:30,d])}if(nz(v.mmse))o.push(['MMSE',cl(v.mmse/30*100),v.mmse+'/30']);
 if(nz(v.tgds))o.push(['TGDS',cl((30-v.tgds)/30*100),v.tgds]);if('pu' in v)o.push(['Skin/pressure',v.pu?25:100,v.pu?'sore':'ok']);return o},
7:v=>{const o=[];if(Array.isArray(v.sf))o.push(['Home hazards',cl((13-v.sf.length)/13*100),v.sf.length+'/13']);if(Array.isArray(v.th))o.push(['Threat types',cl((5-v.th.length)/5*100),v.th.length+'/5']);return o},
8:v=>{const o=[];if('val' in v)o.push(['Meaning in life',v.val?100:0,v.val?'✓':'-']);if('eol' in v)o.push(['End-of-life wish',v.eol?100:0,v.eol?'✓':'-']);return o},
9:v=>{const o=[],n=[v.hos,v.vhc,v.rhp].filter(Boolean).length;if('hos' in v)o.push(['Service access',cl(n/3*100),n+'/3']);if(Array.isArray(v.trv))o.push(['Transport',Math.min(v.trv.length,2)*50,v.trv.length]);return o}};
function radar(ser){const C=180,R=115,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/9;return[C+r*Math.cos(a),C+r*Math.sin(a)]},f=v=>v.map((x,i)=>pt(i,R*(x||0)/100).map(n=>n.toFixed(1)).join(',')).join(' ');
 let g=[25,50,75,100].map(l=>`<polygon points="${f(DOM.map(()=>l))}" fill="none" stroke="#e4ddd0"/>`).join('');
 g+=DOM.map((d,i)=>{const[x,y]=pt(i,R),[lx,ly]=pt(i,R+16);return`<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e4ddd0"/><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10.5" text-anchor="${lx<C-8?'end':lx>C+8?'start':'middle'}" dominant-baseline="middle" fill="#23323a">${d.id}. <tspan>${SHORT[d.id]}</tspan></text>`}).join('');
 ser.forEach(s=>{g+=`<polygon points="${f(s.v)}" fill="${s.c}" fill-opacity="${s.dash?.06:.2}" stroke="${s.c}" stroke-width="2" ${s.dash?'stroke-dasharray="5 3"':''}/>`;
  if(!s.dash)s.v.forEach((x,i)=>{if(x==null)return;const[px,py]=pt(i,R*x/100);g+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4.5" fill="${col(x)}" stroke="#fff"><title>${x}</title></circle>`})});
 return`<svg viewBox="-70 -5 500 370" style="width:100%;max-width:520px;display:block;margin:auto">${g}</svg>`}
function chartHtml(hs){const as=hs.assess.slice().sort((a,b)=>a.date>b.date?1:-1),lat={},fst={},cnt={};
 as.forEach(a=>{const o=pj(a.data);if(!fst[a.domain])fst[a.domain]=o;lat[a.domain]=o;cnt[a.domain]=(cnt[a.domain]||0)+1});
 const T=src=>DOM.map(d=>{try{return src[d.id]?SC[d.id](src[d.id]):[]}catch(e){return[]}}),av=a=>a.length?Math.round(a.reduce((s,x)=>s+x[1],0)/a.length):null,
 tl=T(lat),L=tl.map(av),F=T(fst).map(av),n=L.filter(x=>x!=null).length,cmp=DOM.some(d=>cnt[d.id]>1),ser=[...(cmp?[{c:'#9aa7ad',v:F,dash:1}]:[]),{c:'#0f8b8d',v:L}];
 return`<div class="card"><h4>${ic('bullseye','m')}แผนภูมิใยแมงมุม INHOMESSS</h4><p><span>ประเมินแล้ว</span> <b>${n}/9</b></p><div class="bar d"><i style="width:${n/9*100}%"></i></div>${radar(ser)}
 <div style="text-align:center">${cmp?`<span class="chip" style="background:#9aa7ad33">- - - <span>ครั้งแรก</span></span>`:''}<span class="chip" style="background:#0f8b8d22">● <span>ล่าสุด</span></span><br><small><span>คะแนนสูง = ดี / ความเสี่ยงต่ำ (0–100)</span></small></div>
 <h4>${ic('toolbox','m')}เครื่องมือประเมินในแต่ละด้าน</h4><div class="tg">${DOM.map((d,i)=>`<div class="card" style="margin:0"><b>${ic(d.ico,'m')}${d.id}. <span>${d.th}</span></b><span class="chip sc" style="background:${col(L[i])}33">${L[i]==null?'-':L[i]}</span>${tl[i].length?tl[i].map(t=>`<div class="tr"><span>${esc(t[0])}</span><div class="tb"><span class="fl" style="width:${t[1]}%;background:${col(t[1])}"></span></div><small>${esc(t[2])}</small></div>`).join(''):`<p style="margin:8px 0"><small><span>ยังไม่ได้ประเมิน</span></small> · <a href="#tool/${d.id}"><span>ประเมินตอนนี้</span></a></p>`}</div>`).join('')}</div></div>`}

 $('#sv').onclick=async()=>{const o=collect(r,EL);if(!o.name)return toast('กรุณากรอกชื่อ');busy(1);try{await ups(o);o.problems=JSON.stringify(o.problems);o.lat=$('#la').value;o.lng=$('#ln').value;if(e)o.id=e.id;const nid=await api('saveElder',{elder:o});await needE(1);toast('บันทึกแล้ว');location.hash='elder/'+nid}catch(x){toast(x.message)}busy(0)}}

${B('Adopt A Granny','ปันรัก ปันสุข','โครงการดูแลผู้สูงอายุยากไร้ที่ขาดโอกาส ร่วมกับผู้นำชุมชนและ อสม. ด้วยการเยี่ยมบ้าน ประเมินสุขภาพ มอบอาหาร ยาสามัญประจำบ้าน และปรับปรุงที่อยู่อาศัย (ขยายพื้นที่สู่ อ.แม่สอด จ.ตาก)')}
${B('TaeJai (เทใจ)','แพลตฟอร์มระดมทุน','แพลตฟอร์มระดมทุนเพื่อโครงการเพื่อสังคม การบริจาคเดือนละ 350 บาท หรือ 4,200 บาทต่อปี ช่วยให้ผู้สูงอายุหนึ่งคนมีชีวิตที่ดีขึ้น')}
${B('Buddy HomeCare','วิสาหกิจเพื่อสังคม · เชียงใหม่','เริ่มดำเนินงานตั้งแต่ปี 2558 ให้บริการดูแลผู้สูงอายุและผู้ป่วยที่บ้าน ทำงานร่วมกับมูลนิธิพัฒนางานผู้สูงอายุ')}
<div class="card"><h4>INHOMESSS</h4>Immobility · Nutrition · Housing · Other people · Medication · Examination · Safety · Spiritual health · Services</div>`}
async function users(){const l=await api('listUsers');M.innerHTML=`<h2>ผู้ใช้งาน</h2><div class="card"><input id="un" placeholder="อีเมลหรือชื่อผู้ใช้"><br><br><input id="nn" placeholder="ชื่อ-สกุล"><br><br><input id="pp" type="password" placeholder="รหัสผ่าน"><br><br><select id="rr"><option value="staff">staff</option><option value="admin">admin</option></select><button class="p" id="sv">บันทึก/แก้ไขผู้ใช้</button></div>${l.map(u=>`<div class="card row"><img class="av" src="${esc(u.photo||'')}" alt=""><div style="flex:1"><b>${esc(u.name)}</b><br><small>${esc(u.position||'')}${u.org?' · '+esc(u.org):''}</small><br><small>${esc(u.email||u.username)}${u.phone?' · '+esc(u.phone):''}${u.lang?' · '+esc(u.lang.toUpperCase()):''} · ${esc(u.role)} · <span class="chip">${esc(u.status||'active')}</span></small></div>${['pending','unverified','disabled'].includes(u.status)?`<button class="p s" data-u="${esc(u.username)}" data-s="active">อนุมัติ</button>`:(u.username!=S.user.username?`<button class="p g" data-u="${esc(u.username)}" data-s="disabled">ปิดใช้งาน</button>`:'')}</div>`).join('')}`;
 M.querySelectorAll('[data-u]').forEach(b=>b.onclick=async()=>{try{await api('saveUser',{username:b.dataset.u,status:b.dataset.s});users()}catch(e){toast(e.message)}});
 $('#sv').onclick=async()=>{try{await api('saveUser',{username:$('#un').value.trim().toLowerCase(),name:$('#nn').value,password:$('#pp').value,role:$('#rr').value,status:'active'});toast('บันทึกแล้ว');users()}catch(e){toast(e.message)}}}
window.onhashchange=go;addEventListener('unhandledrejection',e=>toast(String(e.reason?.message||e.reason)));hdr();icons();kit();loadCfg().then(ok=>ok&&go());
