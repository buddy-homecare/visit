const nm=(d,x)=>`d${d.id}_${x.k}`;
function fld(d,x){const n=nm(d,x);if(x.t=='H')return`<h4>${x.l}</h4>`;let c='';
 if(x.t=='T')c=`<input name="${n}">`;else if(x.t=='N')c=`<input type="number" step="any" inputmode="decimal" name="${n}">`;else if(x.t=='D')c=`<input type="date" name="${n}">`;
 else if(x.t=='A')c=`<textarea rows="3" name="${n}"></textarea>`;
 else if(x.t=='S')c=`<select name="${n}"><option value="">-- เลือก --</option>${x.o.map(o=>`<option>${o}</option>`).join('')}</select>`;
 else if(x.t=='C')c=x.o.map(o=>`<label class="o"><input type="checkbox" name="${n}" value="${o}">${o}</label>`).join('');
 else if(x.t=='R')c=x.o.map((o,i)=>`<label class="o"><input type="radio" name="${n}" value="${i+1}">${o}</label>`).join('');
 else if(x.t=='P')c=`<div class="ph"><input type="file" accept="image/*" capture="environment" name="${n}"><img hidden></div>`;
 return`<label>${x.l}</label>${c}`}
function collect(r,d){const o={};d.f.forEach(x=>{if(x.t=='H')return;const n=nm(d,x);
 if(x.t=='C')o[x.k]=[...r.querySelectorAll(`[name="${n}"]:checked`)].map(e=>e.value);
 else if(x.t=='R'){const e=r.querySelector(`[name="${n}"]:checked`);o[x.k]=e?+e.value:''}
 else if(x.t=='P')o[x.k]=r._ph[n]||'';else o[x.k]=r.querySelector(`[name="${n}"]`).value});
 const e=r.querySelector('.res');o._result=e?e.innerText:'';return o}
function showPh(r,n,u){r._ph[n]=u;const i=r.querySelector(`[name="${n}"]`).nextElementSibling;i.src=u;i.hidden=false}
function fill(r,d,v){d.f.forEach(x=>{if(x.t=='H'||!v||v[x.k]==null||v[x.k]==='')return;const n=nm(d,x);let a=v[x.k];
 if(x.t=='C'){if(typeof a=='string')try{a=JSON.parse(a)}catch{a=[a]}r.querySelectorAll(`[name="${n}"]`).forEach(e=>e.checked=a.includes(e.value))}
 else if(x.t=='R'){const e=r.querySelector(`[name="${n}"][value="${a}"]`);if(e)e.checked=true}
 else if(x.t=='P')showPh(r,n,a);else r.querySelector(`[name="${n}"]`).value=x.t=='D'?String(a).slice(0,10):a})}
function mk(d,v){const r=document.createElement('div');r._ph={};r.innerHTML=d.f.map(x=>fld(d,x)).join('')+(d.calc?'<div class="res"></div>':'');if(v)fill(r,d,v);
 const up=()=>{if(d.calc)r.querySelector('.res').innerHTML=d.calc(collect(r,d))};r.addEventListener('input',up);
 r.addEventListener('change',e=>{const el=e.target;if(el.type!='file'||!el.files[0])return;const im=new Image();im.onload=()=>{const s=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);showPh(r,el.name,c.toDataURL('image/jpeg',.7))};im.src=URL.createObjectURL(el.files[0])});up();return r}

const filled=o=>Object.keys(o).some(k=>k!='_result'&&o[k]!==''&&!(Array.isArray(o[k])&&!o[k].length));
function fmt(id,o){const d=DOM.find(x=>x.id==id);if(!d)return'';return d.f.filter(x=>x.t!='H'&&o[x.k]!==undefined&&o[x.k]!==''&&!(Array.isArray(o[x.k])&&!o[x.k].length)).map(x=>`<div><b>${x.l}</b>: ${x.t=='P'?`<a href="${o[x.k]}" target="_blank">📷 ดูรูป</a>`:esc(Array.isArray(o[x.k])?o[x.k].join(', '):x.t=='R'?x.o[o[x.k]-1]:o[x.k])}</div>`).join('')+(o._result?`<div class="res">${esc(o._result)}</div>`:'')}

async function eform(id){await needE();const e=id!='new'&&ELD.find(x=>x.id==id);M.innerHTML=`<h2>${e?'แก้ไข':'เพิ่ม'}ข้อมูลผู้สูงอายุ</h2><div class="card"><div id="fm"></div><label>พิกัดบ้าน</label><input id="la" placeholder="ละติจูด" value="${e?e.lat:''}"><input id="ln" placeholder="ลองจิจูด" value="${e?e.lng:''}"><button class="p g" id="gp">📍 ใช้ตำแหน่งปัจจุบัน</button><br><button class="p s" id="sv">💾 บันทึก</button></div>`;
 const r=mk(EL,e);$('#fm').append(r);$('#gp').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{$('#la').value=p.coords.latitude;$('#ln').value=p.coords.longitude});
 $('#sv').onclick=async()=>{const o=collect(r,EL);if(!o.name)return toast('กรุณากรอกชื่อ');busy(1);try{await ups(o);o.problems=JSON.stringify(o.problems);o.lat=$('#la').value;o.lng=$('#ln').value;if(e)o.id=e.id;const nid=await api('saveElder',{elder:o});await needE(1);toast('บันทึกแล้ว ✔');location.hash='elder/'+nid}catch(x){toast(x.message)}busy(0)}}

${B('Adopt A Granny','ปันรัก ปันสุข','โครงการดูแลผู้สูงอายุยากไร้ที่ขาดโอกาส ร่วมกับผู้นำชุมชนและ อสม. ด้วยการเยี่ยมบ้าน ประเมินสุขภาพ มอบอาหาร ยาสามัญประจำบ้าน และปรับปรุงที่อยู่อาศัย (ขยายพื้นที่สู่ อ.แม่สอด จ.ตาก)')}
${B('TaeJai (เทใจ)','แพลตฟอร์มระดมทุน','แพลตฟอร์มระดมทุนเพื่อโครงการเพื่อสังคม การบริจาคเดือนละ 350 บาท หรือ 4,200 บาทต่อปี ช่วยให้ผู้สูงอายุหนึ่งคนมีชีวิตที่ดีขึ้น')}
${B('Buddy HomeCare','วิสาหกิจเพื่อสังคม · เชียงใหม่','เริ่มดำเนินงานตั้งแต่ปี 2558 ให้บริการดูแลผู้สูงอายุและผู้ป่วยที่บ้าน ทำงานร่วมกับมูลนิธิพัฒนางานผู้สูงอายุ')}
<div class="card"><h4>INHOMESSS</h4>Immobility · Nutrition · Housing · Other people · Medication · Examination · Safety · Spiritual health · Services</div>`}
async function users(){const l=await api('listUsers');M.innerHTML=`<h2>ผู้ใช้งาน</h2><div class="card"><input id="un" placeholder="username"><br><br><input id="nn" placeholder="ชื่อ-สกุล"><br><br><input id="pp" type="password" placeholder="รหัสผ่านใหม่"><br><br><select id="rr"><option value="staff">staff</option><option value="admin">admin</option></select><button class="p" id="sv">บันทึก/แก้ไขผู้ใช้</button></div>${l.map(u=>`<div class="card">${esc(u.username)} · ${esc(u.name)} · ${u.role}</div>`).join('')}`;
 $('#sv').onclick=async()=>{try{await api('saveUser',{username:$('#un').value,name:$('#nn').value,password:$('#pp').value,role:$('#rr').value});toast('บันทึกแล้ว');users()}catch(e){toast(e.message)}}}
window.onhashchange=go;addEventListener('unhandledrejection',e=>toast(String(e.reason?.message||e.reason)));loadCfg().then(ok=>ok&&go());
